
[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "picar-x"
authors = [
  { name="sunfounder", email="service@sunfounder.com" },
  { name="Tobin McD", email="138074176+tobinmcd@users.noreply.github.com" },
]
description = "Picar-X Projects"
readme = "README.md"
requires-python = ">=3.13"
keywords = ["picar-x", "sunfounder"]
dynamic = ["version"]

dependencies = [
    "fastapi[standard]>=0.121.2",
    "gpiozero>=2.0.1",
    "keyboard>=0.13.5",
    "uvicorn>=0.22.0",
]

[dependency-groups]
dev = [
    "poethepoet>=0.27.0",
    "pyright>=1.1.389",
    "pytest>=8.3.4",
    "ruff>=0.9.1",
]
robot = [
    "robot-hat @ git+https://github.com/sunfounder/robot-hat.git",
    "vilib @ git+https://github.com/sunfounder/vilib.git",
    "smbus2>=0.6.0",
    "pyaudio>=0.2.14",
    "aiortc>=1.14.0",
]

[project.scripts]
picarx-serve = "gerg_driver.server:main"

[tool.poe.executor]
type = "uv"

[tool.poe.tasks]
serve = "picarx-serve"
robot-sync = "uv sync --group robot"
sync = "uv sync --group dev"
upgrade = "uv sync --group dev --upgrade"
lint = "python -m ruff check gerg_driver"
lint-fix = "python -m ruff check gerg_driver --fix"
fmt = "python -m ruff format gerg_driver"
fmt-check = "python -m ruff format --check gerg_driver"
typecheck = "python -m pyright"
test = "pytest -q"
fast = { sequence = ["lint", "fmt-check", "typecheck"] }
full = { sequence = ["lint", "fmt-check", "typecheck", "test"] }


[project.urls]
Repository = "https://github.com/tobinmcd/picar-x"

[tool.setuptools]
packages = [
  "picarx",
  "gerg_driver",
]

[tool.setuptools.package-data]
"gerg_driver" = ["templates/*.html"]

[tool.setuptools.dynamic]
version = {attr = "picarx.version.__version__"}

[tool.ruff]
target-version = "py313"
line-length = 100
fix = false
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
typeCheckingMode = "basic"
reportMissingTypeStubs = false
include = ["gerg_driver"]
